# BTC Al/Sat Sinyal ve Backtest Sistemi - Ana Konfigürasyon
#
# Bu dosyadaki değerleri değiştirerek kodu hiç dokunmadan davranışı
# değiştirebilirsiniz (zaman dilimi, veri kaynağı, risk limitleri vb.).

data:
  source: exchange                       # exchange | csv_url (aşağıda açıklandı)
  exchange: okx                          # ccxt borsa id'si (kullanıcı OKX üzerinden işlem yapıyor)
  symbol: BTC/USDT
  timeframe: 1h                          # ccxt formatı: 1m, 5m, 15m, 1h, 4h, 1d ...
  history_start: "2020-01-01T00:00:00Z"  # ne kadar geriye gidileceği (borsanın izin verdiği kadar)
  cache_dir: data/raw                    # ham/temizlenmiş veri cache'i (parquet)
  processed_dir: data/processed          # işlenmiş çıktı (csv, insan tarafından incelenebilir)
  max_retries: 5                         # geçici ağ hatalarında yeniden deneme sayısı
  retry_backoff_seconds: 2               # yeniden denemeler arası bekleme (exponential backoff'un tabanı)

  # `source: csv_url` yapılırsa borsa API'si yerine hazır bir CSV dosyasından
  # (URL) toplu geçmiş veri çekilir. Borsa API'sine erişimin olmadığı ortamlarda
  # (örn. bu projenin ilk geliştirildiği sandbox) veya büyük bir geçmişi tek
  # seferde bootstrap etmek isterseniz kullanışlıdır. Üretim/canlı kullanım
  # için varsayılan `exchange` olmalı. Aşağıdaki örnek MIT lisanslı, günlük
  # güncellenen bir BTC saatlik veri setine işaret eder (kaynak:
  # github.com/mouadja02/bitcoin-technical-indicators-dataset) - gerçek işlem
  # yaptığınız OKX ile birebir aynı fiyatlar olmayabilir (farklı borsa/kaynak).
  csv_url:
    label: github_btc_reference
    url: "https://media.githubusercontent.com/media/mouadja02/bitcoin-technical-indicators-dataset/main/bitcoin-hourly-ohlcv.csv"
    timestamp_unit: s
    column_map:
      timestamp: UNIX_TIMESTAMP
      open: OPEN
      high: HIGH
      low: LOW
      close: CLOSE
      volume: VOLUME_BTC

# Aktif indikatörler ve parametreleri. Bir indikatörü kapatmak için
# `enabled: false` yazmanız yeterli (satırı silmenize gerek yok).
# Yeni bir indikatör eklemek isterseniz: src/indicators/README.md'ye bakın.
indicators:
  sma:
    enabled: true
    windows: [20, 50, 200, 4800]   # 4800 = ~200 gün (1h bar) - donchian_breakout trend filtresi için
  ema:
    enabled: true
    windows: [12, 26]
  rsi:
    enabled: true
    period: 14
  macd:
    enabled: true
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    enabled: true
    window: 20
    num_std: 2
  stochastic:
    enabled: true
    period: 14
    smooth_k: 3
    d_period: 3
  donchian:
    enabled: true
    periods: [480, 1320]   # exit (480=20 gün) ve entry (1320=55 gün) için ayrı Donchian kanalları (saate ölçeklendi)

# Aktif strateji ve parametreleri. `active` hangi stratejinin kullanılacağını
# seçer; o stratejinin kendi bloğu parametrelerini taşır. Yeni bir strateji
# eklemek isterseniz: src/strategies/README.md'ye bakın.
#
# `donchian_breakout` araştırmaya dayalı ana strateji olarak seçildi (bkz.
# src/strategies/donchian_breakout.py docstring'i - Grayscale/SSRN/QuantPedia
# kaynaklı bulgular: BTC'de trend-takip stratejileri mean-reversion'dan
# belirgin şekilde daha dayanıklı). `macd_stochastic` de kayıtlı kalıyor
# (plug-in mimarisi sayesinde), `active` değiştirilerek karşılaştırılabilir.
# NOT: entry/exit/trend_filter periyotları ("Turtle System 2" 55/20 gün +
# 200 günlük trend filtresi) SAATLİK bara doğru ölçeklendi (×24) - ilk
# implementasyonda bu bir hataydı (55/20/200 SAAT olarak kullanılmıştı,
# neredeyse rastgele bir sistem gibi davranmıştı). Detay: src/strategies/
# donchian_breakout.py docstring'i ve src/backtest/README.md.
strategy:
  active: donchian_breakout
  donchian_breakout:
    entry_period: 1320    # 55 gün × 24 saat - yukarıdaki indicators.donchian.periods ile eşleşmeli
    exit_period: 480      # 20 gün × 24 saat - yukarıdaki indicators.donchian.periods ile eşleşmeli
    trend_filter_period: 4800   # 200 gün × 24 saat - yukarıdaki indicators.sma.windows ile eşleşmeli
  macd_stochastic:
    macd_prefix: macd_12_26_9      # yukarıdaki indicators.macd parametreleriyle eşleşmeli
    stoch_prefix: stoch_14_3_3     # yukarıdaki indicators.stochastic parametreleriyle eşleşmeli
    oversold: 20
    overbought: 80

# Backtest motoru ayarları. Motor tek, kesintisiz bir simülasyon çalıştırır;
# yıllık ve rejim bazlı raporlar bu simülasyonun üzerine dilimleme/gruplama
# yaparak üretilir (bkz. src/backtest/README.md).
backtest:
  initial_capital: 10000
  fee_bps: 10          # %0.10 - OKX spot taker ücreti varsayımı (VIP olmayan kullanıcı)
  slippage_bps: 5       # %0.05 - sabit varsayım, gerçekte oynaklığa göre değişir
  periods_per_year: 8766   # 24*365.25 - 1 saatlik bar varsayımı; timeframe değişirse burayı da değiştirin
  out_of_sample_start: "2023-01-01T00:00:00Z"   # in-sample/out-of-sample raporlama kesimi (parametre FIT edilmedi, bkz. README)
  regime:
    sma_period: 4800       # ~200 gün (1h bar) - piyasa rejimi sınıflandırması için
    slope_lookback: 720    # ~30 gün - SMA eğimini ölçmek için pencere
    bull_threshold: 0.05   # SMA bu kadar (%5) yükseldiyse BOĞA
    bear_threshold: -0.05  # SMA bu kadar (%5) düştüyse AYI

# Sonraki adımda (risk yönetimi) doldurulacak.
risk: {}
